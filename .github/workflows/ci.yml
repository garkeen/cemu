# cemu 云端 CI（GitHub Actions）—— 每次 push / PR 跑一遍构建 + 全部回归。
#
# 为什么必须是 windows-latest：cemu 是纯 Win32 程序（windows.h / winsock / GDI
# 只在 src/host/ 里），宿主侧没有可移植分支，Linux runner 上连编译都过不去。
#
# 为什么不需要客户机工具链：测试镜像都已入库（test/riscv64/*.elf 136 份、
# test/x86/*.elf 7 份、realmode.elf、pm_smoke.elf、smoke/cga 的 .bin），
# CI 只构建 cemu 本体。装 nasm 是因为 test/x86/probe/*.asm 那三个冒烟探针的
# .bin 被 .gitignore 覆盖（/test/x86/probe/*.bin），只能在 CI 现生成——不装就
# 是三条 SKIP。
#
# 构建与测试全部走 AGENTS.md 第七节的入口，不另造流程：
#   cmake --build build                         （编译，-Wall -Wextra 须零告警）
#   cmake --build build --target check          （依赖边，tools/depcheck.sh）
#   cmake --build build --target check-riscv64  （test/riscv64/run.sh）
#   cmake --build build --target check-x86      （test/x86/run.sh）
# check-* 目标由 CMake 自己解析 Git 的 bash 并以登录 shell 调用，因此
# dirname/grep/sed/timeout 一定在 PATH 上（D23 的坑，不在 CI 里重演）。
#
# 与开发机的一处差异：tools/clang.cmake 把编译器钉在 D:/LLVM/bin/clang.exe。
# 托管 runner 上没有这个安装——2026-09-23 首跑就死在这条（CMake 报
# "D:/LLVM/bin/clang.exe is not a full path to an existing compiler tool"），
# 所以 CI 不引那个工具链文件，改为在命令行上给出与它逐字等价的设置：编译器
# 取 PATH 上的 clang，目标三元组取 --target=x86_64-w64-mingw32。哪天该文件
# 改成可重定位（不钉绝对路径），这里就能回到 -DCMAKE_TOOLCHAIN_FILE。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消上一轮，别让队列堆着。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # 回归本身很快（riscv 136 格 + x86 14 格），但 guest 全靠 timeout 收场，
    # 真挂住时得有人兜底：整轮硬顶 60 分钟。
    timeout-minutes: 60
    # Windows runner 的 run 默认是 pwsh；本仓库一切脚本都是 bash，显式钉死，
    # 免得命令里出现只有 sh 认识的写法。
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # 与开发机同源的组合：clang 编译，mingw-w64 提供头文件与运行时。
      # gcc 一并装上——它是 clang 定位 mingw sysroot 的锚点，也带来 binutils。
      # update: true 让 pacman 先同步数据库，避免装包静默变成空操作。
      - name: Install toolchain (clang / ninja / nasm / mingw-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path: C:\msys64
          update: true
          install: >-
            mingw-w64-x86_64-clang
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-nasm

      # 接 PATH 之前先断言"东西真在"，不成立就红在这一步：首跑就是栽在
      # "以为装了、其实 PATH 上什么都没有"，一路拖到 Configure 才报一句看不懂的
      # 编译器找不到。
      - name: Put toolchain on PATH
        shell: pwsh
        run: |
          $mingw = "C:\msys64\mingw64"
          foreach ($t in "clang", "cmake", "ninja", "nasm") {
            if (-not (Test-Path "$mingw\bin\$t.exe")) { throw "missing $mingw\bin\$t.exe" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value "$mingw\bin"

      # 编译器是谁、哪一版，直接打进日志——省下一轮"看不见的假设"。
      - name: Toolchain (paths + versions)
        run: |
          command -v clang cmake ninja nasm
          clang --version | head -1
          cmake --version | head -1
          ninja --version
          nasm -v

      # 与 tools/clang.cmake 等价：clang + x86_64-w64-mingw32（mingw-w64 sysroot
      # 由 PATH 上的 gcc 定位），编译器按名字交给 PATH 解析。
      - name: Configure
        id: configure
        run: >-
          cmake -G Ninja -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS=--target=x86_64-w64-mingw32
          -DCMAKE_EXE_LINKER_FLAGS=--target=x86_64-w64-mingw32

      - name: Build (-Wall -Wextra must stay clean)
        id: build
        run: cmake --build build

      # 依赖边检查与编译是否通过无关（纯 grep 头文件），编译红了也让这格出结论。
      - name: Dependency edges (AGENTS.md 第七节)
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: cmake --build build --target check

      - name: riscv64 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target check-riscv64

      # 两套件都要出结论：riscv 红了也把 x86 跑完再收工。
      - name: x86 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target check-x86
