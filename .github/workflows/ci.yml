# cemu 云端 CI（GitHub Actions）—— 每次 push / PR 跑一遍构建 + 三个套件。
#
# 工具链全部用镜像自带的，一个都不装（nasm 除外）。windows-latest 现在是
# Windows Server 2025，镜像里已有：
#   - LLVM 20.1.8（clang 与 ld.lld，C:\Program Files\LLVM\bin，机器 PATH）
#   - CMake、Ninja 1.13.2
#   - mingw-w64 gcc 15.2.0 —— runner-images 的 Install-Mingw64.ps1 把
#     niXman/mingw-builds-binaries 解到 C:\ 并把 C:\mingw64\bin 加进机器 PATH
# cemu 要的正是"clang 编译 + mingw-w64 sysroot"这一组合，镜像现成，所以没有
# 安装步骤；唯一缺的是 nasm：x86 套件里有 21 个探针的 .elf 不入库，靠
# nasm + ld.lld 现场编，缺了这些格是 SKIP 而不是 FAIL。
#
# 为什么必须是 windows-latest：cemu 是纯 Win32 程序（windows.h / winsock / GDI
# 只在 src/host/ 里），宿主侧没有可移植分支，Linux runner 上连编译都过不去。
#
# 为什么不需要客户机工具链：测试镜像都已入库（test/riscv64/*.elf 136 份、
# test/riscv32/*.elf 104 份、x86 的 kvm-unit-tests/realmode/引导扇区镜像），
# CI 只构建 cemu 本体；21 个 x86 探针的 .elf 由 nasm + ld.lld 现场生成。
#
# 构建与测试全部走 AGENTS.md §二的入口，不另造流程：
#   cmake --build build                         （编译，-Wall -Wextra 须零告警）
#   cmake --build build --target check          （依赖边，tools/depcheck.sh）
#   cmake --build build --target check-riscv64  （test/riscv64/run.sh）
#   cmake --build build --target check-riscv32  （test/riscv32/run.sh）
#   cmake --build build --target check-x86      （test/x86/run.sh）
# check-* 目标由 CMake 自己解析 Git 的 bash 并以登录 shell 调用，因此
# dirname/grep/sed/timeout 一定在 PATH 上（D23 的坑，不在 CI 里重演）。
#
# CI 只跑自足探针与入库的 riscv-tests/kvm-unit-tests 镜像：xv6、SeaBIOS、
# Win95 这类真实镜像验收依赖仓外产物（seabios/out、xv6-build），而套件本身
# 按 AGENTS.md §二 禁止引导固件/软盘/光盘镜像，所以它们只在开发机手跑。
#
# 与开发机唯一的差异：不引 tools/clang.cmake —— 它把编译器钉在
# D:/LLVM/bin/clang.exe（开发机的安装路径），托管 runner 上没有这个安装。
# 与它逐字等价的设置直接写在配置命令行上：编译器取 PATH 上的 clang，
# 目标三元组取 --target=x86_64-w64-mingw32（mingw sysroot 由 PATH 上的 gcc 定位）。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支连续 push 时取消上一轮，别让队列堆着。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    # 回归本身很快（riscv64 136 格 + riscv32 104 格 + x86 63 格），但 guest 全靠
    # timeout 收场，真挂住时得有人兜底：整轮硬顶 60 分钟。
    timeout-minutes: 60
    # Windows runner 的 run 默认是 pwsh；本仓库一切脚本都是 bash，显式钉死，
    # 免得命令里出现只有 sh 认识的写法。
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # 镜像里唯一没有的工具。装不上不算致命（缺 .elf 的探针格会 SKIP，不会
      # FAIL），但要在下面那格把结论打出来，别让"少跑了若干格"无声无息。
      - name: nasm (not in the image; builds the x86 probes without a committed .elf)
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\nasm"

      # 编译器是谁、哪一版，直接打进日志：首轮两次翻车都是栽在"以为有、其实没有"。
      - name: Toolchain (paths + versions)
        run: |
          command -v clang ld.lld cmake ninja gcc nasm || true
          clang --version | head -1
          ld.lld --version | head -1
          cmake --version | head -1
          ninja --version
          gcc --version | head -1
          nasm -v 2>/dev/null || echo "nasm missing: x86 probe cells without a committed .elf will SKIP"

      # 与 tools/clang.cmake 等价：clang + x86_64-w64-mingw32，编译器按名字交给
      # PATH 解析（C:\Program Files\LLVM\bin），sysroot 由 PATH 上的
      # C:\mingw64\bin\x86_64-w64-mingw32-gcc.exe 定位。
      - name: Configure
        id: configure
        run: >-
          cmake -G Ninja -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_C_FLAGS=--target=x86_64-w64-mingw32
          -DCMAKE_EXE_LINKER_FLAGS=--target=x86_64-w64-mingw32

      - name: Build (-Wall -Wextra must stay clean)
        id: build
        run: cmake --build build

      # 依赖边检查与编译是否通过无关（纯 grep 头文件），编译红了也让这格出结论。
      - name: Dependency edges (AGENTS.md §二)
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: cmake --build build --target check

      - name: riscv64 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target check-riscv64

      # 三个套件各自出结论：一套红了也把其余跑完再收工。
      - name: riscv32 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target check-riscv32

      - name: x86 suite
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cmake --build build --target check-x86
